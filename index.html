    <style>
      #nfl-splash {
        position: fixed;
        inset: 0;
        background: #0c0d0f;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 2rem;
        transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
      }
      #nfl-splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #nfl-splash .splash-logo-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #nfl-splash img {
        height: clamp(8rem, 26vw, 14rem);
        width: auto;
        object-fit: contain;
        -webkit-user-select: none;
        user-select: none;
        -webkit-user-drag: none;
        animation: nfl-splash-fadein 0.8s ease-out, nfl-splash-float 3s ease-in-out infinite 0.8s;
      }
      #nfl-splash .splash-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(227, 189, 81, 0.2);
        border-top-color: #e3bd51;
        border-radius: 50%;
        animation: nfl-splash-spin 0.9s linear infinite;
      }
      #nfl-splash .splash-text {
        color: #e3bd51;
        font-family: 'EB Garamond', serif;
        font-size: 0.75rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        opacity: 0.95;
        animation: nfl-splash-fadein 1.2s ease-out;
      }
      @keyframes nfl-splash-spin { to { transform: rotate(360deg); } }
      @keyframes nfl-splash-fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes nfl-splash-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
